<!DOCTYPE html>
<html>
<head>
    <title>Basic Form</title>
</head>
<body>
    <form method="POST" action="/confirm">
        Please type in your user name:
        <input type="text" size="20" name="UN" id="userName"/>
        <br /><br />
        Password:
        <input type="password" size="20" name="P" id="password"/>
        <br /><br />
        <input type="submit" value="OKAY" />
        <input type="reset" value="Reset" />           
    </form>
    <br />
    Favourite word: <input type="text" size="20" name="FW" id="favouriteWord"/>
</body>
</html>
