<!DOCTYPE html>
<html>

<head>
    <title>Lists</title>
</head>

<body>
    <h2>Unordered Lists</h2>
    <ul type="disc">
        <li>CPU</li>
        <li>RAM</li>
        <li>GPU</li>
        <li>SSD</li>
    </ul>
    <ul type="circle">
        <li>CPU</li>
        <li>RAM</li>
        <li>GPU</li>
        <li>SSD</li>
    </ul>
    <ul type="square">
        <li>CPU</li>
        <li>RAM</li>
        <li>GPU</li>
        <li>SSD</li>
    </ul>

    <h2>Ordered Lists</h2>
    <ol type="1" start="0">
        <li>CPU</li>
        <li>RAM</li>
        <li>GPU</li>
        <li>SSD</li>
    </ol>
    <ol type="a">
        <li>CPU</li>
        <li>RAM</li>
        <li>GPU</li>
        <li>SSD</li>
    </ol>
    <ol type="I" reversed>
        <li>CPU</li>
        <li>RAM</li>
        <li>GPU</li>
        <li>SSD</li>
    </ol>

</body>

</html>
