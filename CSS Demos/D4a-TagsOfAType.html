<!DOCTYPE html>
<html>

<head>
    <title>Select All Tags of a Particular Type</title>

    <style>
        p {color:green}
        div {background-color: red}
        /* Multiple elements separated by a , */
        h1, a {color: orangered}
        /* h1 a is not the same as h1,a.  
           h1 a means anchor tags in h1 elements.
           h1, a means either h1 tags or a tags. */
          
    </style>
</head>

<body>
    <h1>Heading with Such Tasteful Colours 😁</h2>

    <div>Oh yeah, the colours just get better and better.</div>
    <a href="">Link to nowhere</a>
</body>

</html>
