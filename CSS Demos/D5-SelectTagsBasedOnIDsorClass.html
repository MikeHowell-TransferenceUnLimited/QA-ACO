<!DOCTYPE html>
<html>

<head>
    <title>Select All Tags Based on ID or Class</title>

    <style>
        /* How to style a specific id.  Very popular with DIV's whose ID give implicit semantic meaning. */
        #myDataDiv {color: purple;}
        /* the . is used to define a custom style you can apply to "anything", regardless of element type. */
        .warningClass {color: brown}  
        .errorClass {color: red}   
    </style>
</head>

<body>
    <div id="myDataDiv">Customer lookup results</div>
    <div class="warningClass">Customer owes you money</div>
    <br /><br />
    <div class="errorClass">You can mark anything you like as a warning</div>   
</body>

</html>
