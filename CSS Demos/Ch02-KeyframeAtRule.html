<!DOCTYPE html>
<html>

<head>
    <title>Select All Tags of a Particular Type</title>

    <style>
        @keyframes slidein {
            from {
                margin-left: 100%;
                width: 300%;
                color: red;
            }

            to {
                margin-left: 0%;
                width: 100%;
                color: blue;
            }
        }

        .slide {
            animation-name: slidein;
            animation-duration: 4s;
            animation-timing-function:cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation-fill-mode: forwards;           
        }
    </style>
</head>

<body>
<p class="slide">Movings along...</p>

</body>

</html>
