<!DOCTYPE html>
<html>

<head>
    <title>Selecting Sets of Elements with Pseudo-Classes</title>

    <style>
        li {
            color: blue;
        }

        ul li:first-child {
            background-color: red;
        }

        ul li:last-child {
            background-color: red;
        }

        li:nth-child(3),
        li:nth-child(5) {
            color: peru;
        }

        li:nth-child(3n + 1) {
            color: palevioletred;
        }

        li:nth-child(odd) {
            background-color: lightsalmon;
        }
    </style>
</head>

<body>
    <ul>
        <li>Bella</li>
        <li>Charlie</li>
        <li>Luna</li>
