<!DOCTYPE html>
<html>

<head>
    <style>
        .border1 {
            border: 2px dashed blue;
        }

        .border2 {
            border-style: double;
        }

        .border3 {
            border: 10px inset purple;
        }

        .border4 {
            border: 3px solid orange;
            border-top-left-radius: 50px;
            border-top-right-radius: 30px;
            border-bottom-right-radius: 50px;
            border-bottom-left-radius: 30px;
        }

        .outline1 {
            outline: 3px dashed #3a5c7a;
            outline-offset: 10px
        }
    </style>
</head>

<body>
    <div class="border1">Border 1</div>
    <br/>
    <div class="border2">Border 2</div>
    <br/>
    <div class="border3">Border 3</div>
    <br/>
    <div class="border4">Border 4</div>
    <br/>
    <div class="outline1">Outline 1</div>
    <br/>
</body>

</html>
