<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  .container {
    display: flex;
    flex-wrap: wrap;   /* needed to show align-content */
    height: 200px;     /* gives room for vertical movement */
    border: 1px solid #000;
    padding: 6px;
    gap: 6px;
    
    /* 1) align-items: moves items on the cross axis (single line or each line) */
    align-items: flex-start;
  }

  .item {
    width: 60px;
    height: 40px;
    background: #e0e0e0;
    border: 1px solid #888;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  /* 3) align-self overrides align-items per item */
  .special {
    align-self: flex-end;
    background: #cfe3ff;
  }

  /* 2) align-content: moves *rows* of wrapped content on the cross axis */
  @media (max-width: 500px) {
    .container {
      align-content: center;
    }
  }
</style>
</head>
<body>

<p><strong>Resize width:</strong><br>
• Wide: <code>align-items: flex-start</code><br>
• Narrow: <code>align-content: center</code><br>
• One item uses <code>align-self: flex-end</code></p>

<div class="container">
  <div class="item">A</div>
  <div class="item special">B</div>
  <div class="item">C</div>
  <div class="item">D</div>
  <div class="item">E</div>
</div>

</body>
</html>
