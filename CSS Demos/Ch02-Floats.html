<!DOCTYPE html>
<html>

<head>
    <title>Select All Tags Based on ID or Class</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .title {
            width: 100%;
            text-align: center;
            border: 1px black solid;
        }

        .menu {
            width: 20%;
            float: left;
            border: 1px black solid;
        }

        .body {
            width: 80%;
            float: right;
            border: 1px black solid;
        }

        .footer {
            width: 100%;
            clear: both;
            text-align: center;
            border: 1px black solid;
        }
    </style>
</head>

<body>
    <div>
        <div class="title">TITLE</div>
        <div>
            <div class="menu">MENU<br />1<br />2</div>
            <div class="body">BODY</div>
        </div>
        <div class="footer">Footer</div>
    </div>
</body>

</html>
