<!DOCTYPE html>
<html>

<head>
    <title>Select All Tags of a Particular Type</title>

    <style>
        @keyframes slidein {
            from {
                margin-left: 100%;
                width: 300%;
                color: red;
            }

            to {
                margin-left: 0%;
                width: 100%;
                color: green;
            }
        }


        .slide {
            animation: 6s ease-in 3s 2 reverse both slidein;
        }

    </style>
</head>

<body>
    <p class="slide">Moving along...</p>

</body>

</html>
