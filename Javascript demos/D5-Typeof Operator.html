<html lang="en">

<head>
    <title>Typeof Operator</title>
</head>

<body>
    <script>
        const TYPE_TEST = "string value";
        alert (typeof TYPE_TEST)

        alert (typeof 95)

        let age;
        console.log (typeof age);

        console.log (typeof boom);

        /* Unlike Python, true and false are lowercase */
        let loggedOn = false;
        console.log (loggedOn);

        console.log (`Min number ${Number.MIN_VALUE} max numer ${Number.MAX_VALUE}`);
        console.log (`NaN ${10 / 0} Positive Infinity ${Number.POSITIVE_INFINITY}`);
        console.log (`Square root of -1 ${Math.sqrt(-1)}.`);
    </script>
</body>

</html>
