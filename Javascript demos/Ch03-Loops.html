<!DOCTYPE html>
<html lang="en">

<head>
    <title>Loops</title>
</head>

<body>
    <script>
        document.writeln("For loop: <br />");
        for (let i = 0; i <= 5; i++) {
            document.writeln(i + "<br />");
        }

        document.writeln("While loop: <br />");
        i = 0;
        while (i <= 5) {
            document.writeln(i + "<br />");
            i++;
        }
        document.writeln("Do loop: <br />");
        i = 0;
        do {
            document.writeln(i + "<br />");
            i++;
        } while (i <= 5);
    </script>
</body>

</html>
