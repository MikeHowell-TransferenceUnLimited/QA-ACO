<!DOCTYPE html>
<html lang="en">

<head>
    <title>Hoisting</title>
</head>

<body>
    <script>
        // function hoisting:
        sayHello(); // "Hello!"

        function sayHello() {
            console.log("Hello!");
            document.write("Hello! <br />")
        }

        // variable hoisting:
        document.write(a);  // undefined
        document.write("<br />");
        console.log(a);  // 10

        // console.log(b);  // no such variable
        //  document.write(b);  // no such variable
        // document.write ("<br />");

        var a = 10;
        document.write(a);
        document.write("<br />");
        console.log(a);  // 10           
    </script>
</body>

</html>
