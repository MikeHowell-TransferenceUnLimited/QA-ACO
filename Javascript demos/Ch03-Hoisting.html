<!DOCTYPE html>
<html lang="en">

<head>
    <title>Hoisting</title>
</head>

<body>
    <script>
        // function hoisting:
        sayHello(); // "Hello!"

        function sayHello() {
            console.log("Hello!");
            document.write("Hello! <br />")
        }

        // variable hoisting:
        document.write(a);  // undefined
        document.write("<br />");
        console.log(a);  // 10        

        // Release the next line to see the hoisting work (error disappears)
       // var a = 10;
       /* document.write(a);
        document.write("<br />");
        console.log(a);  // 10           */
    </script>
</body>

</html>
