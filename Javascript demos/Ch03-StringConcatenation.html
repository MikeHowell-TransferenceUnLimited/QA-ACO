<!DOCTYPE html>
<html lang="en">

<head>
    <title>String Concatenation</title>
</head>

<body>
    <script>
        let firstName="Valentino";
        let lastName="Rossi";

        let fullname= firstName + " " + lastName;
        document.write (`${fullname} <br />`);
        fullname = `${firstName} ${lastName}`;
        document.write (`${fullname} <br /> <br />`);

        // string interpolation
        document.write (`${firstName} ${lastName} <br />`);

    </script>
</body>

</html>
