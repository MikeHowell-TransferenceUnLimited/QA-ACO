<!DOCTYPE html>
<html lang="en">

<head>
    <title>Equality and Type</title>
</head>

<body>
    <script>       
        let s = "5";
        let i = 5;

        let total = i + s;
        console.log (total);

        total = i + parseInt(s);
        console.log (total);

        console.log (`Comparison with == ${s==i}`);
        console.log (`Comparison with === ${s===i}`);
    </script>
</body>

</html>
