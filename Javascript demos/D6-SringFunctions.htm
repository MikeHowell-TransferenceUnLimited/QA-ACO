<!DOCTYPE html>
<html lang="en">

<head>
    <title>String Functions</title>
</head>

<body>
    <script>       
        let str="Hello class, welcome to the presentation."

        console.log (`Length ${str.length}`);
        console.log (`indexof ${str.indexOf("Welcome")}`);
        console.log (`charAt() ${str.charAt(6)}`);
        console.log (`toUpperCase ${str.toUpperCase()}`);
    </script>
</body>

</html>
