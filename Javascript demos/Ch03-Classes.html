<!DOCTYPE html>
<html lang="en">

<body>
    <script>
        /*
          Classes allow you to classify (group) data and function together into what is effectively a template for creating objects. 
          Classes are used in many programming languages.  
          
          You use the class, to create new object instances that all have the same fields and functions via the javaScript new command.
          The data in each instance can be edited separately from the other instances.

          Classes can supply validation logic to check that data values assigned to the properties/fields in the class meet specific criteria.
          Classes also offer a constructor mechanism which allows you to create an object from the clas' definition s and load data into it at the same time,
          using a convenient brief notation.

          Classes are explcitly created and used in JavaScript when you want to create objects with the same fields and functions consistently.  
          For one off objects or small quantities of easily reproducible objects, i.e. not too many fields/functions, use the techniques in the previous object demos.
        */

        class plainPlane {
            constructor(manufacturer, model, engines, engine_type, engine_status, landing_gear_status, pilot, radio, lastRunDate, exhaustGasTemps) {
                this.manufacturer = manufacturer;
                this.model = model;
                this.engines = engines;
                this.engine_type = engine_type;
                this.engine_status = engine_status;
                this.landing_gear_status = landing_gear_status;
                this.pilot = pilot;
                this.radio = radio;
                this.lastRunDate = lastRunDate;
                this.exhaustGasTemps = exhaustGasTemps;
            }

            startEngine(engineNumber) {
                alert(`Starting engine ${engineNumber}`);
            }

            shutdownEngine(engineNumber) {
                alert(`Stopping engine ${engineNumber}`);
            }
        }
      
        let plane1 = new plainPlane("Grumman", "F-14b Tomcat", 2, "TurboFan", true, false, "Maverick", "Great balls of fire.", new Date(2022,1,1), [0,0]);
        let plane2 = new plainPlane("McDonnel Douglas", "F-15C Eagle", 2, "TurboFan", true, false, "MaverickLt. Col. David 'Hawk' Andrews", "AWACS, this is Hawk, proceeding to intercept.", new Date(2023,5,14), [0,0]);        
        let plane3 = new plainPlane("General Dynamics", "F-16C Viper", 1, "TurboFan", true, false, "Capt. Sarah 'Falcon' Reyes", "Tanker, Falcon 1-1 on the boom.", new Date(2024,1,22), [420]);
                             
        // Extracting keys and values together
        document.write("<br /><b>Keys and values plane 1:</b><br />");
        for (let [key, value] of Object.entries(plane2)) {
            document.write(`${key} : ${value} <br />`);
        };

        // Extracting keys and values together
        document.write("<br /><b>Keys and values plane 2:</b><br />");
        for (let [key, value] of Object.entries(plane2)) {
            document.write(`${key} : ${value} <br />`);
        };

        // Extracting keys and values together
        document.write("<br /><b>Keys and values plane 3:</b><br />");
        for (let [key, value] of Object.entries(plane3)) {
            document.write(`${key} : ${value} <br />`);
        };

        
        /* --- Display object where possible, not functions, dates. */
        document.write("<br /><b>Display objects as strings</b><br />");
        document.write(JSON.stringify(plane1));
        document.write("<br />");
        document.write(JSON.stringify(plane2));
        document.write("<br />");
        document.write(JSON.stringify(plane3));        
    </script>
</body>

</html>
