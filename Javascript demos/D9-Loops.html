        // Loops applied to lists
        let item;
        items=["Mike", "James", "Peter", "Rene"]
        // This loop returns the index/keys for each item...not quite what we want
        for (i in items){
            document.writeln (i);
        }

        document.write ("<br />");

        for (i in items){
            document.writeln (`key ${i} value=${items[i]} <br />`);
        }

        document.write ("<br />");

        // Loops applied to objects
        // This also returns keys, so you can use the conventional syntax to 
        // resolve each key to the matching value.
        myObject = {firstName: "Mike", lastName: "Howell", city:"Leeds"};
        for (key in myObject){
            document.writeln(`key ${key} property=${myObject[key]} <br />`);
        }
    </script>
