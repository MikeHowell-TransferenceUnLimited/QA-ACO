<!DOCTYPE html>
<html lang="en">

<head>
    <title>Variables and Types</title>
</head>

<body>
    <script>
        let x = 99;
        var y = 0;
        const zero = 0;

        function doVeryLittle(){
            y = 10;
        }

        document.write (`${x}<br />`);

        doVeryLittle();
        document.write (`${y}<br />`);
        document.write (`${zero}<br />`);

        zero = 1;

        /* Data types */
        let capitalScotland = "Edinburgh";
        let isColour=true;
        let shoeSize=13;
        let weight=100.23;
        let theUnknown = null;
        let forgotToSetIt; // = undefined;
        let object = {name: "Mike", age: 35, hasBirthday:function(){this.age++}};
        let fruitArray = ['Orange', 'Peach', 'Banana'];
    </script>
</body>

</html>
